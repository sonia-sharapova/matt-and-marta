<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/m.png" />
    <title>RSVP - Marta & Matt</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
<div class="container">
    <a href="index.html">
        <img src="us.png" alt="Marta and Matt" class="logo">
    </a>
    <h1 class="page-title">rsvp</h1>
    <div class="back">
        <ul>
            <li><a href="index.html">← home</a></li>
        </ul>
    </div>
    <div class="content">
        <div class="section">

            <p style="text-align: left; font-size: 14px; margin-bottom: 40px;"><strong>RSVP Deadline:</strong> Early July 2026</p>

            <div class="success-message" id="successMessage">
                Thank you for your RSVP! We look forward to celebrating with you.
            </div>

            <form class="rsvp-form" id="rsvpForm">
                <div class="form-group">
                    <label for="fullName">Full name *</label>
                    <input type="text" id="fullName" name="fullName" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="attending">Attending *</label>
                    <select id="attending" name="attending" required>
                        <option value="">Please select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="afterparty">Attending afterparty (10 PM–2 AM) *</label>
                    <select id="afterparty" name="afterparty" required>
                        <option value="">Please select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                        <option value="maybe">Maybe</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="dietary">Dietary restrictions/allergies (if not applicable, please write n/a or "none") *</label>
                    <textarea id="dietary" name="dietary" required></textarea>
                </div>

                <div class="form-group" style="text-align: center;">
                    <button type="submit" class="submit-btn">Submit RSVP</button>
                </div>
            </form>


            <p class="contact-note">Please reach out to us directly at
                <span><a href="tel:+1-408-813-0951" class="phone-link">
                    (408) 813-0951</a></span> if you have any questions, concerns or requests.</p>
        </div>
    </div>

</div>

<script>
    // Server endpoint configuration
    const SERVER_ENDPOINT = 'https://matt-and-marta.com/api/rsvp';

    document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        // Collect form data
        const formData = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            attending: document.getElementById('attending').value,
            afterparty: document.getElementById('afterparty').value,
            dietary: document.getElementById('dietary').value,
            timestamp: new Date().toISOString()
        };

        try {
            const response = await fetch(SERVER_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                // Success - show thank you message
                document.getElementById('rsvpForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('successMessage').scrollIntoView({ behavior: 'smooth' });
            } else {
                // Server error
                alert('There was an error submitting your RSVP. Please try again or contact us directly at (408) 813-0951.');
            }
        } catch (error) {
            // Network error
            console.error('Error submitting RSVP:', error);
            alert('There was an error submitting your RSVP. Please check your internet connection and try again, or contact us directly at (408) 813-0951.');
        }
    });
</script>
<script src="password.js"></script>
</body>
</html>
